 <text x="169" y="115" font-family="Georgia,serif" font-weight="700" font-size="70" fill="#0b3153">Leland</text>
 <text x="175" y="145" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.4" fill="#0b3153">NEWS · PEOPLE · PLACES</text>
