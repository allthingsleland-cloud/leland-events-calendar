<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">All Things Leland Community Events Calendar</title>
<desc id="desc">A scenic Cape Fear area river sunset with a bridge, All Things Leland branding, and the Community Events Calendar title.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78b8e8"/><stop offset=".52" stop-color="#f9d9b0"/><stop offset="1" stop-color="#f4a65d"/></linearGradient>
