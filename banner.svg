 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7d9d4e"/><stop offset="1" stop-color="#294f38"/></linearGradient>
 <linearGradient id="titlefade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
</defs>
<rect width="1600" height="500" fill="url(#sky)"/>
